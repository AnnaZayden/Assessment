[project]
name = "ours-image-service"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
include = ["app*", "image_client*"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "coverage==7.16.2",
    "playwright==1.63.0",
    "trustme==1.2.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

# Tool configuration only; runtime dependencies are in requirements.txt.

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90", "N", "ASYNC", "S", "PL", "PT", "RET"]

[tool.ruff.lint.pylint]
# The client SDK's methods take the API's six query parameters as keyword-only options.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S104", "PLR0913", "PLR0917"]
# The UI really renders dimensions with a multiplication sign ("800 × 600").
"tests/test_ui.py" = ["RUF001"]

[tool.mypy]
strict = true
files = ["app", "image_client"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "imageio_ffmpeg"
ignore_missing_imports = true  # ships no type hints; we only call get_ffmpeg_exe()

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*install `httpx2`.*"]

[tool.coverage.run]
branch = true
source = ["app", "image_client"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
