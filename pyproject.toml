# Tool configuration only; dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90", "N", "ASYNC", "S", "PL", "PT", "RET"]

[tool.ruff.lint.pylint]
# The client SDK's methods take the API's six query parameters as keyword-only options.
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S104", "PLR0913", "PLR0917"]
# The UI really renders dimensions with a multiplication sign ("800 × 600").
"tests/test_ui.py" = ["RUF001"]

[tool.mypy]
strict = true
files = ["app", "image_client"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*install `httpx2`.*"]

[tool.coverage.run]
branch = true
source = ["app", "image_client"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
